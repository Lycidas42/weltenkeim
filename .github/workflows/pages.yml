# Veröffentlicht Weltenkeim auf GitHub Pages, sobald main gepusht wird.
# Es werden nur die Dateien ausgeliefert, die das Spiel zur Laufzeit braucht (Liste unten);
# Blender-Quellen, Dev-Seiten und Doku bleiben im Repo, aber nicht auf der Seite.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Spieldateien zusammenstellen
        run: |
          mkdir -p _site/assets
          cp index.html game.js sw.js manifest.webmanifest _site/
          cp -r icons vendor _site/
          cp -r assets/models _site/assets/
          cp assets/CREDITS.md _site/assets/

      - name: Offline-Liste aus sw.js prüfen
        # Fehlt eine Datei der APP-Liste, scheitert die Installation des Service Workers auf der Live-Seite.
        run: |
          missing=0
          for f in $(grep -oE "'\./[^']+'" sw.js | tr -d "'" | sed 's|^\./||'); do
            if [ ! -e "_site/$f" ]; then echo "::error::Fehlt im Paket: $f"; missing=1; fi
          done
          exit $missing

      - name: Version in index.html und sw.js gleich
        # Der Update-Hinweis vergleicht die Version der Seite (meta wk-version) mit der des Service Workers.
        run: |
          sw=$(grep -oE "const VERSION = '[^']+'" sw.js | grep -oE "[0-9]+\.[0-9]+\.[0-9]+")
          page=$(grep -oE 'name="wk-version" content="[^"]+"' index.html | grep -oE "[0-9]+\.[0-9]+\.[0-9]+")
          if [ "$sw" != "$page" ]; then echo "::error::Version sw.js ($sw) und index.html ($page) unterschiedlich"; exit 1; fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
